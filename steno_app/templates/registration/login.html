{% extends 'steno_app/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl relative">

        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-blue-500/10 text-blue-400 mb-4 shadow-inner ring-1 ring-blue-500/20">
                <i class="fas fa-fingerprint text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-2">Sign in to access your secure dashboard.</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div class="p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium">
                <p class="flex items-center gap-2"><i class="fas fa-exclamation-circle"></i> Invalid credentials.</p>
            </div>
            {% endif %}

            <div class="space-y-4">
                <div>
                    <label
                        class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Username</label>
                    <input type="text" name="username"
                        class="w-full px-3 py-2 bg-black/20 border border-white/10 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm text-gray-200 placeholder-gray-600 transition duration-200 outline-none hover:border-white/20"
                        placeholder="Enter your username" required autofocus>
                </div>

                <div>
                    <label
                        class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Password</label>
                    <input type="password" name="password"
                        class="w-full px-3 py-2 bg-black/20 border border-white/10 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm text-gray-200 placeholder-gray-600 transition duration-200 outline-none hover:border-white/20"
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit"
                class="w-full py-2.5 px-6 rounded-lg bg-white text-black text-sm font-semibold hover:bg-gray-200 transition shadow-[0_0_20px_rgba(255,255,255,0.1)] mt-2">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <p class="text-gray-500 text-xs">
                Don't have an account?
                <a href="{% url 'signup' %}" class="text-white hover:text-gray-300 font-medium transition ml-1">Create
                    account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
