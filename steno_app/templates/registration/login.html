{% extends 'steno_app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card shadow-lg">
            <div class="card-header text-center py-3">
                <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-glow w-100 mt-3 fw-bold">Login</button>
                </form>
            </div>
            <div class="card-footer text-center py-3" style="border-top: 1px solid rgba(255,255,255,0.1);">
                <small>Don't have an account? <a href="{% url 'signup' %}" class="text-warning fw-bold">Sign Up
                        Here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
